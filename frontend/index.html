<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Premium AI Chat</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables for Premium Dark Theme */
        :root {
            --bg-primary: #030303;
            --bg-secondary: #0a0a0b;
            --bg-tertiary: #121214;
            --bg-accent: #1a1a20;
            --bg-elevated: #16161a;
            --text-primary: #f5f5f7;
            --text-secondary: #98989d;
            --text-muted: #58585e;
            --border-color: #2a2a30;
            --border-subtle: #1c1c1f;
            --accent-color: #5e6ad2;
            --accent-hover: #7c85e0;
            --accent-glow: rgba(94, 106, 210, 0.4);
            --accent-gradient: linear-gradient(135deg, #5e6ad2 0%, #a855f7 100%);
            --user-bubble: #1a2332;
            --ai-bubble: #1a1a1e;
            --success-color: #34c759;
            --warning-color: #ff9f0a;
            --error-color: #ff453a;
            --sidebar-width: 300px;
            --transition-speed: 0.25s;
            --glass-bg: rgba(10, 10, 11, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f0;
            --bg-accent: #e8e8e8;
            --text-primary: #1a1a1a;
            --text-secondary: #505050;
            --text-muted: #808080;
            --border-color: #d0d0d0;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --user-bubble: #3b82f6;
            --ai-bubble: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
            transition: background 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 30px;
            position: relative;
        }

        .loading-logo::before,
        .loading-logo::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .loading-logo::before {
            width: 100%;
            height: 100%;
            background: var(--accent-gradient);
            opacity: 0.3;
            animation-delay: 0s;
        }

        .loading-logo::after {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            background: var(--accent-gradient);
            opacity: 0.6;
            animation-delay: 0.3s;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.6;
            }
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* App Layout */
        .app-container {
            display: flex;
            height: 100vh;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .app-container.loaded {
            opacity: 1;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            transition: all var(--transition-speed);
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            background: var(--accent-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            font-size: 24px;
            background: var(--accent-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(94, 106, 210, 0.5));
        }

        .new-chat-btn {
            width: calc(100% - 32px);
            margin: 8px 16px;
            padding: 14px 18px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(94, 106, 210, 0.3);
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(94, 106, 210, 0.4);
        }

        .new-chat-btn:active {
            transform: translateY(0);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            margin-top: 8px;
        }

        .sessions-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 12px 12px 8px;
            margin-bottom: 4px;
        }

        .session-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            margin-bottom: 4px;
            position: relative;
            overflow: hidden;
        }

        .session-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 100%;
            background: var(--accent-gradient);
            opacity: 0.1;
            transition: width 0.3s;
        }

        .session-item:hover {
            background: var(--bg-accent);
            border-color: var(--border-subtle);
        }

        .session-item:hover::before {
            width: 100%;
        }

        .session-item.active {
            background: var(--bg-elevated);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 1px rgba(94, 106, 210, 0.2);
        }

        .session-item.active::before {
            width: 4px;
            background: var(--accent-gradient);
            opacity: 1;
        }

        .session-icon {
            color: var(--text-secondary);
            font-size: 16px;
            width: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .session-item.active .session-icon {
            color: var(--accent-color);
        }

        .session-info {
            flex: 1;
            overflow: hidden;
            z-index: 1;
        }

        .session-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }

        .session-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .session-delete {
            color: var(--text-muted);
            padding: 6px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            border-radius: 6px;
            z-index: 1;
        }

        .session-delete:hover {
            color: var(--error-color);
            background: rgba(255, 69, 58, 0.1);
        }

        .session-item:hover .session-delete {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--glass-border);
        }

        .model-select-wrapper {
            position: relative;
        }

        .model-select {
            width: 100%;
            padding: 12px 36px 12px 14px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            appearance: none;
            transition: all 0.2s;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2398989d' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 10px center;
            background-repeat: no-repeat;
        }

        .model-select:hover {
            border-color: var(--accent-color);
            background-color: var(--bg-accent);
        }

        .model-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.15);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
        }

        /* Header */
        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(3, 3, 3, 0.8);
            backdrop-filter: blur(20px);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-model {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            transition: all 0.2s;
        }

        .current-model:hover {
            border-color: var(--accent-color);
        }

        .settings-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 16px;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .settings-toggle:hover {
            background: var(--bg-accent);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Settings Panel */
        .settings-panel {
            position: absolute;
            top: 75px;
            right: 20px;
            width: 360px;
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 24px;
            display: none;
            z-index: 100;
            animation: slideDown 0.3s;
        }

        .settings-panel.open {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .settings-panel h3 {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-row {
            margin-bottom: 20px;
        }

        .setting-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .setting-row textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 80px;
            transition: all 0.2s;
        }

        .setting-row textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .setting-row select {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .setting-row select:hover {
            border-color: var(--accent-color);
        }

        .setting-row input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-gradient);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(94, 106, 210, 0.4);
            transition: transform 0.2s;
        }

        .setting-row input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .temperature-value {
            display: inline-block;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 13px;
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 6px;
            margin-left: 8px;
        }

        .theme-toggle {
            display: flex;
            gap: 10px;
        }

        .theme-option {
            flex: 1;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .theme-option:hover {
            border-color: var(--accent-color);
            background: var(--bg-accent);
        }

        .theme-option.active {
            background: var(--accent-gradient);
            border-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 15px rgba(94, 106, 210, 0.3);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .welcome-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-secondary);
        }

        .welcome-icon {
            font-size: 80px;
            background: var(--accent-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            animation: pulse 3s infinite;
            filter: drop-shadow(0 0 30px rgba(94, 106, 210, 0.4));
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            font-size: 15px;
            max-width: 500px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .message-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            animation: messageEnter 0.3s;
            position: relative;
        }

        @keyframes messageEnter {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user-avatar {
            background: var(--accent-gradient);
            box-shadow: 0 4px 15px rgba(94, 106, 210, 0.3);
        }

        .ai-avatar {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
        }

        .message-content {
            flex: 1;
            max-width: calc(100% - 52px);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-author {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-message .message-author {
            color: var(--accent-color);
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .message-text {
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.7;
        }

        .user-message {
            flex-direction: row-reverse;
        }

        .user-message .message-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .user-message .message-text {
            background: var(--accent-gradient);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(94, 106, 210, 0.25);
        }

        .ai-message .message-text {
            background: var(--ai-bubble);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-subtle);
        }

        /* Message Actions */
        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .message-action-btn:hover {
            background: var(--bg-accent);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 20px;
            background: var(--ai-bubble);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            border: 1px solid var(--border-subtle);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            animation: typing 1.5s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            50% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-area {
            padding: 20px 30px;
            background: var(--bg-primary);
            border-top: 1px solid var(--glass-border);
        }

        .input-container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 4px 25px rgba(94, 106, 210, 0.25);
        }

        .input-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            resize: none;
            max-height: 200px;
            padding: 12px;
            outline: none;
            line-height: 1.6;
        }

        .input-textarea::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
        }

        .action-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.2s;
            font-size: 16px;
            position: relative;
        }

        .action-btn:hover {
            color: var(--accent-color);
            background: var(--bg-accent);
            border-color: var(--accent-color);
        }

        /* Pro Feature Tooltip */
        .pro-feature {
            position: relative;
        }

        .pro-feature::after {
            content: 'Available in Pro version';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: var(--bg-elevated);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .pro-feature:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-12px);
        }

        .pro-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-gradient);
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Stop Button */
        .stop-btn {
            background: var(--error-color);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 69, 58, 0.3);
        }

        .stop-btn:hover {
            background: #ff5c4f;
            transform: translateY(-2px);
        }

        .stop-btn.active {
            display: flex;
        }

        .send-btn {
            background: var(--accent-gradient);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(94, 106, 210, 0.3);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(94, 106, 210, 0.4);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            background: var(--border-color);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .char-count {
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 8px;
        }

        /* Regenerate Button */
        .regenerate-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .regenerate-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .regenerate-btn:hover {
            background: var(--bg-accent);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Markdown Content */
        .markdown-content {
            line-height: 1.7;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            margin: 20px 0 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .markdown-content p {
            margin-bottom: 14px;
        }

        .markdown-content code {
            background: var(--bg-tertiary);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            color: #f472b6;
            border: 1px solid var(--border-subtle);
        }

        .markdown-content pre {
            background: var(--bg-tertiary);
            padding: 18px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 16px 0;
            border: 1px solid var(--border-subtle);
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
            border: none;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 14px 0;
            padding-left: 24px;
        }

        .markdown-content li {
            margin-bottom: 6px;
        }

        .markdown-content blockquote {
            border-left: 3px solid var(--accent-color);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
        }

        .markdown-content a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .markdown-content a:hover {
            border-bottom-color: var(--accent-color);
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        .markdown-content th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }

        /* Copy Button */
        .copy-code-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--bg-accent);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-code-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .code-block-wrapper {
            position: relative;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                overflow: hidden;
            }

            .message {
                max-width: 100%;
            }

            .input-area {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-logo"></div>
        <div class="loading-text">Initializing Bloom...</div>
        <div class="loading-text" id="backend-status">Starting backend server...</div>
    </div>

    <!-- App Container -->
    <div class="app-container" id="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-spa"></i>
                    <span>Bloom</span>
                </div>
            </div>

            <button class="new-chat-btn" id="new-chat-btn">
                <i class="fa-solid fa-plus"></i>
                <span>New Chat</span>
            </button>

            <div class="sessions-list" id="sessions-list">
                <div class="sessions-title">Past Sessions</div>
                <div id="sessions-container"></div>
            </div>

            <div class="sidebar-footer">
                <label class="model-select-label"
                    style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; display: block; font-weight: 500;">
                    <i class="fa-solid fa-microchip"></i> Model
                </label>
                <div class="model-select-wrapper">
                    <select class="model-select" id="model-select">
                        <option value="loading" disabled>Loading models...</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <div class="chat-title">
                    <h2 style="font-size: 18px; font-weight: 600;">Chat</h2>
                    <div class="current-model">
                        <i class="fa-solid fa-microchip"></i>
                        <span id="current-model-display">Select a model</span>
                    </div>
                </div>

                <button class="settings-toggle" id="settings-toggle" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </header>

            <!-- Settings Panel -->
            <div class="settings-panel" id="settings-panel">
                <h3><i class="fa-solid fa-sliders"></i> Settings</h3>

                <div class="setting-row">
                    <label class="setting-label">Theme</label>
                    <div class="theme-toggle">
                        <div class="theme-option active" data-theme="dark">
                            <i class="fa-solid fa-moon"></i> Dark
                        </div>
                        <div class="theme-option" data-theme="light">
                            <i class="fa-solid fa-sun"></i> Light
                        </div>
                    </div>
                </div>

                <div class="setting-row">
                    <label class="setting-label">System Prompt</label>
                    <textarea id="system-prompt-input" placeholder="Enter custom system prompt..."></textarea>
                </div>

                <div class="setting-row">
                    <label class="setting-label">Temperature <span class="temperature-value"
                            id="temp-value">0.7</span></label>
                    <input type="range" id="temperature-slider" min="0" max="2" step="0.1" value="0.7">
                </div>

                <div class="setting-row">
                    <label class="setting-label">Default Model</label>
                    <select class="model-select" id="default-model-select"></select>
                </div>

                <div class="setting-row">
                    <label class="setting-label">Danger Zone</label>
                    <button class="send-btn" style="background: var(--error-color);" id="clear-history-btn">
                        <i class="fa-solid fa-trash"></i> Clear All History
                    </button>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" id="chat-area">
                <div class="welcome-message" id="welcome-message">
                    <div class="welcome-icon">
                        <i class="fa-solid fa-spa"></i>
                    </div>
                    <div class="welcome-title">Welcome to Bloom</div>
                    <div class="welcome-subtitle">
                        Your premium offline AI chat experience.<br>
                        Select a model and start your conversation.
                    </div>
                </div>

                <div class="message-container" id="message-container" style="display: none;"></div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea class="input-textarea" id="chat-input"
                            placeholder="Type a message... (Shift+Enter for new line)" rows="1"></textarea>
                        <div class="input-actions">
                            <button class="action-btn pro-feature" id="add-image-btn" title="Add image">
                                <i class="fa-solid fa-image"></i>
                                <span class="pro-badge">PRO</span>
                            </button>
                            <button class="action-btn pro-feature" id="attach-btn" title="Attach file">
                                <i class="fa-solid fa-paperclip"></i>
                                <span class="pro-badge">PRO</span>
                            </button>
                            <span class="char-count" id="char-count">0/4000</span>
                            <button class="stop-btn" id="stop-btn">
                                <i class="fa-solid fa-stop"></i>
                                <span>Stop</span>
                            </button>
                            <button class="send-btn" id="send-btn">
                                <span>Send</span>
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
